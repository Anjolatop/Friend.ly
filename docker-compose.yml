version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: friendly
      POSTGRES_USER: friendly
      POSTGRES_PASSWORD: friendly_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://friendly:friendly_password@postgres:5432/friendly
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your_jwt_secret_here
      - YOUTUBE_API_KEY=your_youtube_api_key_here
      - OPENAI_API_KEY=your_openai_api_key_here
    depends_on:
      - postgres
      - redis
    volumes:
      - ./server:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:

